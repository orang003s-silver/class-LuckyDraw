<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 행운의 뽑기 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .jua-font {
            font-family: 'Jua', sans-serif;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.8); }
        }
        .glow-box {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-pink-50 to-sky-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-md border border-amber-200/60 rounded-3xl shadow-xl overflow-hidden p-6 relative">
        
        <!-- 단계 1: 설정 화면 -->
        <div id="setup-screen" class="space-y-6">
            <div class="text-center space-y-2">
                <span class="inline-block bg-amber-100 text-amber-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Lucky Draw System</span>
                <h1 class="jua-font text-3xl text-amber-600 drop-shadow-sm">행운의 뽑기 대잔치</h1>
                <p class="text-slate-500 text-sm">인원수를 설정하고 제외할 번호를 입력하세요.</p>
            </div>

            <div class="space-y-4 bg-amber-50/50 p-4 rounded-2xl border border-amber-100">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">총 참여 인원 수 (최대 번호)</label>
                    <input type="number" id="total-participants" min="1" max="100" value="10" 
                        class="w-full bg-white border border-amber-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-amber-400 text-lg shadow-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">당첨 인원 수</label>
                    <input type="number" id="total-winners" min="1" max="50" value="3" 
                        class="w-full bg-white border border-amber-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-amber-400 text-lg shadow-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">제외할 번호 (콤마로 구분, 예: 3, 7)</label>
                    <input type="text" id="excluded-numbers" placeholder="없으면 빈칸으로 두세요" 
                        class="w-full bg-white border border-amber-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-amber-400 text-sm shadow-sm">
                </div>
            </div>

            <button onclick="startDrawProcess()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold jua-font text-xl py-4 rounded-2xl shadow-md transition transform active:scale-95">
                다음으로 넘어가기 🚀
            </button>
        </div>

        <!-- 단계 2: 뽑기 진행 화면 -->
        <div id="draw-screen" class="hidden text-center space-y-6">
            <div class="flex justify-between items-center bg-amber-50/80 px-4 py-2 rounded-xl border border-amber-200 text-sm">
                <span id="progress-indicator" class="text-amber-600 font-bold">참가자 1 / 10</span>
                <span id="status-badge" class="bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-full text-xs">순서 대기중</span>
            </div>

            <div class="py-4">
                <h2 id="current-player-title" class="jua-font text-4xl text-slate-800 mb-2">1번 참가자</h2>
                <p class="text-slate-500 text-sm">버튼을 눌러 운을 시험해보세요!</p>
            </div>

            <!-- 뽑기 상자 모형 -->
            <div id="box-container" class="relative w-48 h-48 mx-auto bg-gradient-to-b from-amber-400 to-orange-500 rounded-3xl border-4 border-amber-200 glow-box flex items-center justify-center cursor-pointer transition transform hover:scale-105 shadow-lg" onclick="triggerDraw()">
                <div id="box-content" class="text-center space-y-2">
                    <span class="text-5xl block animate-bounce-slow">🎁</span>
                    <span class="jua-font text-xl text-white drop-shadow">뽑기 상자</span>
                </div>
                <!-- 결과 표시 오버레이 -->
                <div id="result-overlay" class="absolute inset-0 bg-white/95 rounded-2xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                    <span id="result-emoji" class="text-6xl mb-2">🎉</span>
                    <span id="result-text" class="jua-font text-3xl">당첨!</span>
                    <span id="auto-next-timer" class="text-xs text-slate-400 mt-2">3초 뒤 다음으로 넘어갑니다...</span>
                </div>
            </div>

            <button id="draw-btn" onclick="triggerDraw()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold jua-font text-xl py-4 rounded-2xl shadow-md transition transform active:scale-95">
                당첨 꽝 확인하기 ✨
            </button>
        </div>

        <!-- 단계 3: 최종 결과 화면 -->
        <div id="final-screen" class="hidden space-y-6">
            <div class="text-center space-y-2">
                <span class="inline-block bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Completed</span>
                <h2 class="jua-font text-3xl text-amber-600">최종 추첨 결과 안내</h2>
                <p class="text-slate-500 text-sm">모든 참가자의 운명이 결정되었습니다!</p>
            </div>

            <div class="bg-amber-50/50 border border-amber-200 rounded-2xl p-4 max-h-60 overflow-y-auto space-y-2" id="final-results-list">
                <!-- 동적 결과 목록 -->
            </div>

            <button onclick="resetApp()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold jua-font text-lg py-3 rounded-xl shadow-md transition transform active:scale-95">
                처음부터 다시하기 🔄
            </button>
        </div>

    </div>

    <script>
        let config = {
            totalParticipants: 10,
            totalWinners: 3,
            excluded: []
        };

        let activeNumbers = [];
        let winnersList = [];
        let currentIndex = 0;
        let participantResults = {}; // 번호별 결과 저장
        let isDrawing = false;
        let autoTimer = null;

        function startDrawProcess() {
            const totalP = parseInt(document.getElementById('total-participants').value);
            const totalW = parseInt(document.getElementById('total-winners').value);
            const excludedStr = document.getElementById('excluded-numbers').value;

            if (isNaN(totalP) || totalP < 1) {
                alert('참여자 수는 1 이상이어야 합니다.');
                return;
            }
            if (isNaN(totalW) || totalW < 1) {
                alert('당첨 인원은 1 이상이어야 합니다.');
                return;
            }
            if (totalW > totalP) {
                alert('당첨 인원이 전체 참여자 수보다 많을 수 없습니다.');
                return;
            }

            // 제외 번호 파싱
            let excluded = [];
            if (excludedStr.trim() !== '') {
                excluded = excludedStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            }

            // 유효한 번호 목록 생성
            activeNumbers = [];
            for (let i = 1; i <= totalP; i++) {
                if (!excluded.includes(i)) {
                    activeNumbers.push(i);
                }
            }

            if (totalW > activeNumbers.length) {
                alert('제외된 번호를 제외한 유효 인원보다 당첨 인원이 더 많습니다.');
                return;
            }

            config.totalParticipants = totalP;
            config.totalWinners = totalW;
            config.excluded = excluded;

            // 당첨 번호 무작위 선정
            let shuffled = [...activeNumbers].sort(() => Math.random() - 0.5);
            winnersList = shuffled.slice(0, totalW);

            // 초기화
            currentIndex = 0;
            participantResults = {};

            // 화면 전환
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('draw-screen').classList.remove('hidden');

            loadCurrentParticipant();
        }

        function loadCurrentParticipant() {
            if (currentIndex >= activeNumbers.length) {
                showFinalScreen();
                return;
            }

            const currentNum = activeNumbers[currentIndex];
            document.getElementById('progress-indicator').innerText = `참가자 ${currentIndex + 1} / ${activeNumbers.length} (실제 번호: ${currentNum}번)`;
            document.getElementById('current-player-title').innerText = `${currentNum}번 참가자`;
            
            // UI 초기화
            const overlay = document.getElementById('result-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('draw-btn').disabled = false;
            document.getElementById('draw-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            isDrawing = false;
        }

        function triggerDraw() {
            if (isDrawing) return;
            isDrawing = true;

            const currentNum = activeNumbers[currentIndex];
            const isWinner = winnersList.includes(currentNum);
            
            participantResults[currentNum] = isWinner;

            // 버튼 비활성화
            document.getElementById('draw-btn').disabled = true;
            document.getElementById('draw-btn').classList.add('opacity-50', 'cursor-not-allowed');

            // 결과 오버레이 셋팅
            const overlay = document.getElementById('result-overlay');
            const emojiEl = document.getElementById('result-emoji');
            const textEl = document.getElementById('result-text');

            if (isWinner) {
                emojiEl.innerText = "🎉";
                textEl.innerText = "당첨! (축하합니다)";
                textEl.className = "jua-font text-3xl text-amber-600";
            } else {
                emojiEl.innerText = "💧";
                textEl.innerText = "꽝! (아쉽네요)";
                textEl.className = "jua-font text-3xl text-slate-400";
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');

            // 3초 후 자동 넘어가기
            let timeLeft = 3;
            const timerEl = document.getElementById('auto-next-timer');
            timerEl.innerText = `${timeLeft}초 뒤 다음으로 넘어갑니다...`;

            autoTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = `${timeLeft}초 뒤 다음으로 넘어갑니다...`;
                } else {
                    clearInterval(autoTimer);
                    currentIndex++;
                    loadCurrentParticipant();
                }
            }, 1000);
        }

        function showFinalScreen() {
            document.getElementById('draw-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');

            const listContainer = document.getElementById('final-results-list');
            listContainer.innerHTML = '';

            // 전체 참가자 결과 리스트 렌더링
            activeNumbers.forEach(num => {
                const isWin = winnersList.includes(num);
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-xl border ${isWin ? 'bg-amber-100/60 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-700'}`;
                
                item.innerHTML = `
                    <span class="font-bold">${num}번 참가자</span>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${isWin ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-600'}">
                        ${isWin ? '🏆 당첨' : '꽝'}
                    </span>
                `;
                listContainer.appendChild(item);
            });
        }

        function resetApp() {
            if (autoTimer) clearInterval(autoTimer);
            document.getElementById('final-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
